[package]
name = "olympia"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
encoding_rs = "0.8.42"
htmd = "0.5.5"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
# Already in the tree via tokio; used to kill a timed-out converter's whole process group.
libc = "0.2"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["serde"] }
